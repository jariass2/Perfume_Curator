{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-luxury-gradient py-12 px-4">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <div class="mx-auto w-16 h-16 rounded-full bg-gradient-to-br from-luxury-gold to-luxury-gold-light flex items-center justify-center shadow-2xl">
                <span class="text-luxury-dark font-serif font-bold text-2xl">P</span>
            </div>
            <h2 class="mt-6 font-serif text-3xl font-bold text-white">
                Iniciar Sesión
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Accede a tu colección personal de perfumes
            </p>
        </div>

        <form method="POST" class="mt-8 space-y-6">
            <div class="bg-luxury-dark border border-luxury-border rounded-2xl p-8">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                            Email
                        </label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            class="w-full px-4 py-3 bg-luxury-darker border border-luxury-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-luxury-gold focus:border-transparent transition-all duration-200"
                            placeholder="tu@email.com"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                            Contraseña
                        </label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            class="w-full px-4 py-3 bg-luxury-darker border border-luxury-border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-luxury-gold focus:border-transparent transition-all duration-200"
                            placeholder="••••••••"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full mt-8 flex items-center justify-center px-6 py-4 text-base font-semibold text-luxury-dark bg-gradient-to-r from-luxury-gold to-luxury-gold-light rounded-lg hover:shadow-lg hover:shadow-luxury-gold/20 transition-all duration-300 transform hover:-translate-y-0.5"
                >
                    Iniciar Sesión
                </button>
            </div>
        </form>

        <div class="text-center">
            <p class="text-sm text-gray-400">
                ¿No tienes una cuenta?
                <a href="/register" class="font-medium text-luxury-gold hover:text-luxury-gold-light transition-colors">
                    Regístrate
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
